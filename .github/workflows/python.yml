name: Python

on:
  pull_request:
    paths:
      - "python/**"
      - "tools/**"
      - "Makefile"
      - ".github/workflows/python.yml"
  push:
    branches: [main]
    paths:
      - "python/**"
      - "tools/**"
      - "Makefile"
      - ".github/workflows/python.yml"

permissions:
  contents: read

jobs:
  compatibility:
    name: Python 3.10 core
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: python/pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "./python[dev]"

      - name: Check
        run: python -m pytest python -m "not integration"

  full:
    name: Python 3.13 full
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: python/pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "./python[dev,test-eo]"

      - name: Check
        run: |
          python -m ruff format --check --config python/pyproject.toml python/taco python/tests python/examples
          python -m ruff check --config python/pyproject.toml python/taco python/tests python/examples tools
          python -m mypy --config-file python/pyproject.toml python/taco
          python -m pytest python --cov=taco --cov-config=python/pyproject.toml --cov-report=term-missing
